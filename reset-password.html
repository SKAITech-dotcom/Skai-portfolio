<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SkaiTechgh</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen flex items-center justify-center px-4">
  <main class="w-full max-w-md">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-500 to-purple-600 mb-4">
        <i class="fas fa-lock text-2xl text-white"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">Reset your password</h1>
      <p class="text-slate-400 text-sm mt-2">Choose a new password for your SkaiTechgh admin account.</p>
    </div>

    <div class="glass-card p-8">
      <div id="reset-message" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
      <form id="reset-form" class="hidden">
        <label for="new-password" class="form-label">New password</label>
        <input type="password" id="new-password" class="form-input mb-4" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters">
        <label for="confirm-password" class="form-label">Confirm password</label>
        <input type="password" id="confirm-password" class="form-input mb-6" minlength="8" required autocomplete="new-password" placeholder="Repeat your password">
        <button type="submit" id="reset-submit" class="btn-primary w-full justify-center py-3">
          <i class="fas fa-save"></i> Update password
        </button>
      </form>
      <a href="admin/" class="block text-center text-sm text-primary-400 hover:text-primary-300 mt-5">Back to admin login</a>
    </div>
  </main>

  <script src="js/config.js?v=reset-flow-2"></script>
  <script src="js/reset-password.js?v=reset-flow-2"></script>
</body>
</html>
